# Docker Compose lit automatiquement .env pour l'interpolation.
# Pour utiliser un autre fichier de prod, lancez explicitement :
# docker compose --env-file .env.docker.local -f docker-compose.prod.yml up -d

services:
    ###> Application FrankenPHP (Production) ###
    app:
        build:
            context: .
            dockerfile: Dockerfile.prod
            args:
                BUILDKIT_CONTEXT_KEEP_GIT_DIR: 1
        container_name: doc2sail-app
        restart: unless-stopped
        ports:
            - "127.0.0.1:8000:80"
        dns:
            - 8.8.8.8
            - 8.8.4.4
            - 1.1.1.1
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            # Seulement les volumes nécessaires en production
            - ./public/uploads:/app/public/uploads
        environment:
            APP_ENV: prod
            APP_SECRET: ${APP_SECRET}
            DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data.db"
            DEFAULT_URI: ${DEFAULT_URI:-https://doc2sail.com}
            MERCURE_URL: http://mercure/.well-known/mercure
            MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://doc2sail.platypus-home.noho.st/.well-known/mercure}
            MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
            MAILER_DSN: ${MAILER_DSN}
            MAILER_FROM: ${MAILER_FROM}
            VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
            VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
            VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@doc2sail.platypus-home.noho.st}
            CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https://(app\.)?doc2sail\.com$}
        networks:
            - doc2sail-network
        # Limites de ressources pour Raspberry Pi
        deploy:
            resources:
                limits:
                    memory: 512M
                reservations:
                    memory: 256M
    ###< Application FrankenPHP ###

    ###> Mercure Hub ###
    mercure:
        image: dunglas/mercure:latest
        container_name: doc2sail-mercure
        restart: unless-stopped
        command: caddy run --config /etc/caddy/Caddyfile
        ports:
            - "127.0.0.1:3000:80"
        environment:
            SERVER_NAME: ":80"
            MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
            MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
            MERCURE_EXTRA_DIRECTIVES: |
                anonymous
                cors_origins https://doc2sail.com https://app.doc2sail.com http://localhost:8000
        volumes:
            - mercure-data:/data
            - mercure-config:/config
        networks:
            - doc2sail-network
        # Limites de ressources
        deploy:
            resources:
                limits:
                    memory: 128M
                reservations:
                    memory: 64M
    ###< Mercure Hub ###

volumes:
    app-uploads:
        driver: local
    mercure-data:
        driver: local
    mercure-config:
        driver: local

networks:
    doc2sail-network:
        driver: bridge
