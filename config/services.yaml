# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    documents_directory: "%kernel.project_dir%/public/uploads/documents"
    mailer_from: "%env(MAILER_FROM)%"

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: "../src/"

    # Configuration du service d'upload de documents
    App\Service\DocumentUploader:
        arguments:
            $targetDirectory: "%documents_directory%"

    # Configuration du service Web Push
    App\Service\WebPushService:
        arguments:
            $vapidPublicKey: "%env(VAPID_PUBLIC_KEY)%"
            $vapidPrivateKey: "%env(VAPID_PRIVATE_KEY)%"
            $vapidSubject: "%env(VAPID_SUBJECT)%"

    # Configuration de la commande de test du Magic Link / LoginLink handler
    Symfony\Component\Security\Http\LoginLink\LoginLinkHandler:
        public: true
        arguments:
            $options:
                route_name: "app_login_check"
                lifetime: 900 # 15 minutes
                max_uses: 3
                signature_properties: ["id"]

    # Alias the interface to the concrete LoginLinkHandler so autowiring works
    Symfony\Component\Security\Http\LoginLink\LoginLinkHandlerInterface: '@Symfony\Component\Security\Http\LoginLink\LoginLinkHandler'

    # Ensure the SignatureHasher type can be autowired (use the remember_me hasher)
    Symfony\Component\Security\Core\Signature\SignatureHasher: "@security.authenticator.remember_me_signature_hasher.main"

    # Configuration de la commande de test du Magic Link

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Controller\AuthController:
        arguments:
            $magicLinkLimiter: "@limiter.magic_link_request_by_email"

    # Décorateur OpenAPI pour ajouter les endpoints personnalisés dans Swagger
    App\Api\OpenApiDecorator:
        decorates: "api_platform.openapi.factory"
        arguments: ['@App\Api\OpenApiDecorator.inner']
