framework:
    asset_mapper:
        # Application assets are built with Webpack Encore.
        # Keep AssetMapper for bundle assets, including API Platform Swagger UI.
        paths: []
        importmap_path: "%kernel.project_dir%/config/importmap.php"
        missing_import_mode: strict

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
