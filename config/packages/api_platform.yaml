api_platform:
    title: Hello API Platform
    version: 1.0.0
    mapping:
        paths: ["%kernel.project_dir%/src/Entity"]
    formats:
        jsonld: ["application/ld+json"]
        json: ["application/json"]
    defaults:
        stateless: true
        cache_headers:
            vary: ["Content-Type", "Authorization", "Origin"]
    docs_formats:
        jsonopenapi: ["application/vnd.openapi+json"]
        json: ["application/json"]
        html: ["text/html"]
    swagger:
        versions: [3]
