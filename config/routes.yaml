root_redirect:
    path: /
    controller: App\Controller\RootRedirectController::redirectToLocale

api_refresh_token:
    path: /api/token/refresh

api_controllers:
    resource:
        path: ../src/Api/
        namespace: App\Api
    type: attribute
    prefix: /

controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute
    # rendre le préfixe de locale optionnel en fournissant une valeur par défaut
    prefix: /{_locale}
    #defaults:
    #    _locale: "fr"
    requirements:
        _locale: en|fr
    exclude:
        - ../src/Controller/ApiAuthController.php
        - ../src/Controller/UserController.php
        - ../src/Controller/DevTokenController.php

# Contrôleurs API sans préfixe locale (routes directes /api/...)
auth_api_no_locale:
    resource: ../src/Controller/ApiAuthController.php
    type: attribute

user_api_no_locale:
    resource: ../src/Controller/UserController.php
    type: attribute

dev_api_no_locale:
    resource: ../src/Controller/DevTokenController.php
    type: attribute
