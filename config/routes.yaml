root_redirect:
    path: /
    controller: App\Controller\RootRedirectController::redirectToLocale

api_controllers:
    resource:
        path: ../src/Api/
        namespace: App\Api
    type: attribute

controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute
    # rendre le préfixe de locale optionnel en fournissant une valeur par défaut
    prefix: /{_locale}
    #defaults:
    #    _locale: "fr"
    requirements:
        _locale: en|fr
# config/routes.yaml
api_refresh_token:
    path: /api/token/refresh
