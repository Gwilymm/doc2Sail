services:
  ###> Application FrankenPHP ###
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - .:/app
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-changeme}
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data.db"
      MAILER_DSN: smtp://mailer:1025
      MAILER_FROM: noreply@doc2sail.local
    # Configuration DNS pour résoudre les problèmes de résolution pendant le build
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    depends_on:
      - mailer
  ###< Application FrankenPHP ###

  ###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  ###< symfony/mailer ###

  ###> symfony/mercure ###
  mercure:
    image: dunglas/mercure:latest
    restart: unless-stopped
    environment:
      # Production : change ces clés !
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      MERCURE_SUBSCRIBER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      # Autoriser les anonymous (pour partie publique)
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        cors_origins http://localhost:8000 http://127.0.0.1:8000 http://192.168.1.2:8000
    # Commenté pour déploiement sans SSL
    # command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    ports:
      - "3000:80"
    volumes:
      - mercure_data:/data
      - mercure_config:/config
  ###< symfony/mercure ###

volumes:
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
